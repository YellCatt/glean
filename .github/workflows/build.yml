name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 版本号 = 构建时间（东八区），格式 YYYY-MM-DD_HH-MM-SS
      # 注意：值中不能含空格，否则会破坏 -ldflags 的参数切分
      - name: 生成版本号（东八区构建时间）
        id: ver
        run: |
          BUILD_TIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d_%H-%M-%S')
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "本次版本号(构建时间, 东八区): $BUILD_TIME"

      - name: 构建 linux/mipsle（路由器插件，软浮点）
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.build_time }}" \
            -o default.glean_linux_mipsle main.go

      - name: 校验版本号已注入二进制
        run: |
          if grep -a -q -F "${{ steps.ver.outputs.build_time }}" default.glean_linux_mipsle; then
            echo "已注入: ${{ steps.ver.outputs.build_time }}"
          else
            echo "未在二进制中找到版本号，构建中止" >&2
            exit 1
          fi

      - name: 发布到 dev-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: dev-latest (${{ steps.ver.outputs.build_time }})
          body: 构建时间（东八区）：${{ steps.ver.outputs.build_time }}
          files: default.glean_linux_mipsle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
