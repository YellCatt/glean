# glean 配置文件
# 程序启动时读取（默认工作目录下的 config.yaml，可用 -config=路径 指定其他文件）
# 字段留空则回退到内置默认值；环境变量优先级高于本文件

mail:
  smtp_host: smtp.qq.com       # SMTP 服务器地址
  smtp_port: 465               # 端口：465=隐式 TLS，587=STARTTLS
  from: 768305875@qq.com       # 发件邮箱
  auth_code: gpfruabgjebubdad  # 邮箱授权码（非登录密码）
  to: 768305875@qq.com         # 收件邮箱，多个用 , 或 ; 分隔
  subject_prefix: '业务监控'    # 邮件主题前缀，留空则不加前缀
  skip_verify: true            # 是否跳过 TLS 证书校验

report:
  # 每天生成定时报告的时刻（东八区 HH:MM），默认 05:00，支持分钟
  # 例：改成 '08:30' 表示每天东八区 8:30 生成前一天的报告
  # 旧字段 hour: 5 仍兼容（等价于 05:00），建议统一用 time
  time: '05:00'                # 默认早上 5 点
  # 每天定时生成的报告是否发送邮件，默认 true（发送）
  # 改成 false 则只写 reports/ 文件并打印到日志，不发邮件
  periodic_mail: true          # 默认开启
  # 启动时立即生成的日报/周报/月报/年报，是否同时发送邮件
  # false（默认）：只写 reports/ 文件并打印到日志，不发邮件
  # true        ：启动即发送 4 封报告邮件
  startup_mail: false          # 默认关闭